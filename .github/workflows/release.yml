name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.0.39-beta，不带头 v）"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
            task: release:build:macos:arm64
            artifact: cursor-switch-*-macos-arm64.tar.gz
          - target: macos-amd64
            runner: macos-latest
            task: release:build:macos:amd64
            artifact: cursor-switch-*-macos-amd64.tar.gz
          - target: windows-amd64
            runner: windows-latest
            task: release:build:windows:amd64
            artifact: cursor-switch-*-windows-amd64.zip
          - target: linux-amd64
            runner: ubuntu-latest
            task: release:build:linux:amd64
            artifact: cursor-switch-*-linux-amd64.tar.gz

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - run: npm install -g yarn

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --version=35.0 -y

      - name: Generate proto code
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
          wails3 task common:generate:proto

      - name: Verify version sync
        # 校验 build/config.yml 与 windows/info.json、wails.exe.manifest 三处版本一致，
        # 不一致则发版前直接失败，避免资产版本与二进制自报版本错位。
        run: go run ./scripts/release verify-versions -config ./build/config.yml

      - name: Verify trigger version matches config (F-26)
        # F-26：发布触发版本（tag 或 workflow_dispatch input）必须与 build/config.yml 一致。
        # 此前只校验仓库内部三处版本同步，触发版本与配置版本错配会产生 release vX / 二进制 manifest vY 错配。
        shell: bash
        run: |
          CONFIG_VER="$(go run ./scripts/release version -config ./build/config.yml)"
          TRIGGER="${{ github.event.inputs.version || github.ref_name }}"
          TRIGGER="${TRIGGER#v}"
          if [ "$CONFIG_VER" != "$TRIGGER" ]; then
            echo "::error::trigger version '$TRIGGER' != config.yml version '$CONFIG_VER'"
            exit 1
          fi
          echo "trigger version matches config: $CONFIG_VER"

      - name: Set version (tag trigger)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "Building from tag ${{ github.ref_name }}"

      - name: Ensure release directory
        shell: bash
        run: |
          VERSION="$(go run ./scripts/release version -config ./build/config.yml)"
          mkdir -p "bin/release/${VERSION}"
          echo "Release dir: bin/release/${VERSION}"

      - name: Build release asset
        run: wails3 task ${{ matrix.task }}
        env:
          APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: bin/release/*/cursor-switch-*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: find assets -type f | head

      - name: Flatten assets
        shell: bash
        run: |
          find assets -type f -name 'cursor-switch-*' -exec mv {} assets/ \;
          find assets -type f | head

      - name: Generate update.json (unsigned, as build artifact — F-11)
        # F-11：签名私钥 ~/.cursor-switch-release.key 仅本地持有，绝不进 CI。
        # 此前 CI 生成未签名 update.json 并直接作为 release 资产上传——形成"公开未签名 manifest 窗口"，
        # 客户端虽会拒绝未签名 manifest，但维护者若忘记签名重传，用户长期看到更新失败。
        # 现改为：CI 只把未签名 manifest 作为 build artifact 上传，不发布到 release；
        # 维护者下载 artifact → 本地 sign → gh release upload，签名后再发布。
        # 这样 release 上要么没有 update.json（用户无更新提示，不报错），要么是已签名版本，杜绝未签名窗口。
        # F-26：manifest 生成失败必须终止 workflow（此前用 `|| echo` 吞掉，可能发布缺 manifest 的 release）。
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          go run ./scripts/release manifest \
            -config ./build/config.yml \
            -assets-dir assets \
            -out assets/update.json \
            -repo "kael-odin/cursor-switch" \
            -base-name "cursor-switch" \
            -notes release-notes.md

      - name: Upload unsigned manifest as build artifact (F-11)
        # 未签名 manifest 仅作 artifact 供维护者本地签名，绝不直接进 release 资产。
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-update-json
          path: assets/update.json
          retention-days: 14

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          # F-11：故意不发布 update.json——签名前的 manifest 不可作为 release 资产。
          # 维护者本地签名后用 `gh release upload vX update.json --clobber` 补传。
          files: |
            assets/cursor-switch-*
          prerelease: ${{ contains(github.event.inputs.version || github.ref_name, 'beta') }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
