name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.0.39-beta，不带头 v）"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
            task: release:build:macos:arm64
            artifact: cursor-byok-*-macos-arm64.tar.gz
          - target: macos-amd64
            runner: macos-latest
            task: release:build:macos:amd64
            artifact: cursor-byok-*-macos-amd64.tar.gz
          - target: windows-amd64
            runner: windows-latest
            task: release:build:windows:amd64
            artifact: cursor-byok-*-windows-amd64.zip
          - target: linux-amd64
            runner: ubuntu-latest
            task: release:build:linux:amd64
            artifact: cursor-byok-*-linux-amd64.tar.gz

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - run: npm install -g yarn

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --version=35.0 -y

      - name: Generate proto code
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
          wails3 task common:generate:proto

      - name: Verify version sync
        # 校验 build/config.yml 与 windows/info.json、wails.exe.manifest 三处版本一致，
        # 不一致则发版前直接失败，避免资产版本与二进制自报版本错位。
        run: go run ./scripts/release verify-versions -config ./build/config.yml

      - name: Set version (tag trigger)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "Building from tag ${{ github.ref_name }}"

      - name: Ensure release directory
        shell: bash
        run: |
          VERSION="$(go run ./scripts/release version -config ./build/config.yml)"
          mkdir -p "bin/release/${VERSION}"
          echo "Release dir: bin/release/${VERSION}"

      - name: Build release asset
        run: wails3 task ${{ matrix.task }}
        env:
          APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: bin/release/*/cursor-byok-*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: find assets -type f | head

      - name: Flatten assets
        shell: bash
        run: |
          find assets -type f -name 'cursor-byok-*' -exec mv {} assets/ \;
          find assets -type f | head

      - name: Generate update.json
        # The manifest generated here is UNSIGNED. To enable signature enforcement,
        # a maintainer runs locally after the release is created:
        #   go run ./scripts/release keypair            # once, keep private key secret
        #   go run ./scripts/release sign -manifest <downloaded update.json>
        #   # paste the public key into internal/updater/pubkey.go releasePublicKeyHex
        #   # re-upload the signed update.json to the release
        # Until releasePublicKeyHex is populated, the updater accepts unsigned manifests
        # (checksum-only) for backward compatibility.
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          go run ./scripts/release manifest \
            -config ./build/config.yml \
            -assets-dir assets \
            -out assets/update.json \
            -repo "kael-odin/cursor-byok" \
            -base-name "cursor-byok" \
            -notes release-notes.md || echo "manifest generation skipped"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: |
            assets/cursor-byok-*
            assets/update.json
          prerelease: ${{ contains(github.event.inputs.version || github.ref_name, 'beta') }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
