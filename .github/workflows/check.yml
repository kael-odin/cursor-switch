name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: go vet+build+test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Install Linux GUI deps
        # go vet ./... 会传递编译 wails v3 的 cgo 包(internal/assetserver/webview 等)，
        # 它们用 pkg-config 探测 gtk/webkit。与 release.yml 保持一致地装 dev 库。
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install protoc
        # gen/（cursor/gen/agentv1 等）由 protoc 生成，不入库（.gitignore）。
        # CI 干净环境必须先生成，否则 go vet/build 找不到包。
        run: sudo apt-get install -y protobuf-compiler

      - name: Generate proto code
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
          protoc -I ./proto --go_out=. --go_opt=module=cursor --connect-go_out=. --connect-go_opt=module=cursor ./proto/agent_v1.proto ./proto/aiserver_v1.proto

      - name: Stub frontend/dist
        # main.go 用 //go:embed all:frontend/dist；CI 不跑完整 vite build，
        # 用占位文件满足 embed 编译期检查（不验证前端产物，前端另有本地 build 保证）。
        run: mkdir -p frontend/dist && touch frontend/dist/.embed-stub

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./internal/... ./scripts/...

      - name: go test -race
        # P0 release gate：S14/F-28 broker 并发、S20/F-35 hijacked conn + 生命周期状态机、
        # F-02 配置锁、F-13 会话崩溃一致性等大批安全修复都涉及并发，-race 是"证明这批
        # 大规模安全修改没引入回归"最直接的动态验收。本地无 gcc 跑不了，CI ubuntu 有 gcc。
        # CGO_ENABLED=1 是 setup-go 在纯 Go job 的默认 0 的显式覆盖（-race 依赖 cgo）。
        env:
          CGO_ENABLED: "1"
        run: go test -race ./internal/...

  frontend:
    # P0 release gate：前端此前 CI 只 stub frontend/dist 占位编译，从不验证前端能真正构建。
    # S17（生产 console 脱敏）等修复改了 clientApi.js，需保证 production build 不破。
    # 暂不加 ESLint/Vitest——前端无现成 lint/test 基础设施，从零搭建投入大，留后续决策。
    # 复刻 release.yml 的前端构建链：wails3 generate bindings 生成 frontend/bindings/*
    # （wails-typed-events 插件依赖 eventcreate 模块），不先生成 bindings 直接 yarn build
    # 会报 "Event bindings module not found"。
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install yarn
        run: npm install -g yarn

      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.0"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate proto + bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
          wails3 task common:generate:proto
          wails3 task common:generate:bindings

      - name: Build frontend
        working-directory: frontend
        run: yarn install --frozen-lockfile && yarn build

  versions:
    name: version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Install Linux GUI deps
        # scripts/release 经 cursor/internal/updater → wails v3 传递依赖 cgo 包
        # (internal/assetserver/webview 等)，go run 任意子命令（含 verify-versions
        # 这种纯字符串校验）都会触发 pkg-config 探测 gtk/webkit。与 go job 一致装 dev 库。
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Verify version sync
        # 校验 build/config.yml 与 windows/info.json、wails.exe.manifest 三处版本一致，
        # 防止发版时资产版本与二进制自报版本错位。
        run: go run ./scripts/release verify-versions -config ./build/config.yml

