<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">cursor-switch 三条控制面分离架构</title>
  <desc id="archDesc">Cursor 客户端请求进入本地 cursor-switch，按请求类型分流到三条互不干扰的控制面：身份/marketplace 官方透传、订阅/套餐本地 mock、模型推理 byok 路由并统计成本。</desc>

  <defs>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/>
    </marker>
    <marker id="aMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="16" fill="#0b0e14"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" text-rendering="geometricPrecision">

    <!-- ============ Column 1: Cursor client ============ -->
    <rect x="40" y="200" width="180" height="100" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="130" y="232" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="600">Cursor 客户端</text>
    <text x="130" y="252" font-size="12" fill="#7d8590" text-anchor="middle">IDE / agent 窗口</text>
    <text x="130" y="272" font-size="12" fill="#7d8590" text-anchor="middle">所有请求经本地代理</text>

    <!-- ============ Column 2: cursor-switch core ============ -->
    <rect x="320" y="60" width="240" height="400" rx="14" fill="#0d2818" stroke="#3fb950" stroke-width="1.4" opacity="0.55"/>
    <rect x="320" y="60" width="240" height="44" rx="14" fill="#0d2818" stroke="#3fb950" stroke-width="1.4"/>
    <text x="440" y="88" font-size="16" fill="#3fb950" text-anchor="middle" font-weight="700">cursor-switch（本地）</text>

    <!-- classifier node -->
    <rect x="345" y="130" width="190" height="50" rx="10" fill="#0b0e14" stroke="#3fb950" stroke-width="1"/>
    <text x="440" y="152" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="600">请求分类器</text>
    <text x="440" y="170" font-size="11" fill="#7d8590" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/aiserver · /proxy · /cursor</text>

    <!-- three lanes inside core -->
    <!-- lane 1: identity -->
    <rect x="345" y="210" width="190" height="60" rx="9" fill="#0b0e14" stroke="#3fb950" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="440" y="234" font-size="12.5" fill="#3fb950" text-anchor="middle" font-weight="600">身份控制面</text>
    <text x="440" y="252" font-size="11" fill="#7d8590" text-anchor="middle">marketplace · 登录 · customize</text>

    <!-- lane 2: subscription -->
    <rect x="345" y="290" width="190" height="60" rx="9" fill="#0b0e14" stroke="#7d8590" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="440" y="314" font-size="12.5" fill="#c9d1d9" text-anchor="middle" font-weight="600">订阅控制面</text>
    <text x="440" y="332" font-size="11" fill="#7d8590" text-anchor="middle">套餐 · 用量 · 模型门禁</text>

    <!-- lane 3: model routing -->
    <rect x="345" y="370" width="190" height="60" rx="9" fill="#1a1530" stroke="#a371f7" stroke-width="1.2"/>
    <text x="440" y="394" font-size="12.5" fill="#a371f7" text-anchor="middle" font-weight="600">模型推理控制面</text>
    <text x="440" y="412" font-size="11" fill="#7d8590" text-anchor="middle">byok 路由 · agent · 统计</text>

    <!-- ============ Column 3: destinations ============ -->
    <!-- dest 1: cursor.sh -->
    <rect x="680" y="215" width="200" height="50" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
    <text x="780" y="237" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="600">官方 cursor.sh</text>
    <text x="780" y="254" font-size="11" fill="#7d8590" text-anchor="middle">真实账号透传</text>

    <!-- dest 2: local mock -->
    <rect x="680" y="295" width="200" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="780" y="317" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="600">本地 mock 应答</text>
    <text x="780" y="334" font-size="11" fill="#7d8590" text-anchor="middle">无限制 Pro · 不锁 auto</text>

    <!-- dest 3: provider -->
    <rect x="680" y="375" width="200" height="50" rx="10" fill="#1a1530" stroke="#a371f7" stroke-width="1.4"/>
    <text x="780" y="397" font-size="13" fill="#a371f7" text-anchor="middle" font-weight="600">你的 LLM provider</text>
    <text x="780" y="414" font-size="11" fill="#7d8590" text-anchor="middle">OpenAI / Anthropic 兼容</text>

    <!-- ============ Column 4: cost stats sink ============ -->
    <rect x="960" y="370" width="200" height="60" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="1060" y="394" font-size="13" fill="#a371f7" text-anchor="middle" font-weight="600">usage.json + 仪表盘</text>
    <text x="1060" y="412" font-size="11" fill="#7d8590" text-anchor="middle">按日 / 模型 / provider 成本</text>

    <!-- ============ Arrows ============ -->
    <!-- client -> core -->
    <path d="M220 250 H320" stroke="#7d8590" stroke-width="1.8" fill="none" marker-end="url(#aMuted)"/>
    <text x="270" y="242" font-size="11" fill="#7d8590" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">HTTPS :8413</text>

    <!-- classifier -> lanes -->
    <path d="M440 180 V210" stroke="#3fb950" stroke-width="1.4" fill="none" marker-end="url(#aGreen)"/>
    <path d="M415 180 V290" stroke="#7d8590" stroke-width="1.4" fill="none" marker-end="url(#aMuted)"/>
    <path d="M465 180 V370" stroke="#a371f7" stroke-width="1.4" fill="none" marker-end="url(#aPurple)"/>

    <!-- lanes -> destinations -->
    <path d="M535 240 H680" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#aGreen)"/>
    <path d="M535 320 H680" stroke="#7d8590" stroke-width="1.6" fill="none" marker-end="url(#aMuted)"/>
    <path d="M535 400 H680" stroke="#a371f7" stroke-width="1.6" fill="none" marker-end="url(#aPurple)"/>

    <!-- provider -> cost sink -->
    <path d="M880 400 H960" stroke="#a371f7" stroke-width="1.4" fill="none" marker-end="url(#aPurple)" stroke-dasharray="4 3"/>
    <text x="920" y="392" font-size="10.5" fill="#a371f7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">token 计量</text>

    <!-- ============ Legend ============ -->
    <g transform="translate(40 478)" font-size="12">
      <rect x="0" y="-12" width="14" height="14" rx="3" fill="#0b0e14" stroke="#3fb950"/>
      <text x="22" y="-1" fill="#7d8590">身份面：官方透传</text>
      <rect x="200" y="-12" width="14" height="14" rx="3" fill="#0b0e14" stroke="#7d8590"/>
      <text x="222" y="-1" fill="#7d8590">订阅面：本地 mock</text>
      <rect x="410" y="-12" width="14" height="14" rx="3" fill="#1a1530" stroke="#a371f7"/>
      <text x="432" y="-1" fill="#7d8590">推理面：byok 路由 + 成本统计</text>
      <text x="700" y="-1" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">— 三面互不干扰 · 互不影响登录态 —</text>
    </g>

  </g>
</svg>
