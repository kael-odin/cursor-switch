<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="heroTitleEN heroDescEN">
  <title id="heroTitleEN">cursor-switch — route any LLM API key into Cursor, keep the real-account marketplace, with precise cost stats</title>
  <desc id="heroDescEN">Dark technical hero: project name cursor-switch with a one-line value prop on the left, and a three-plane routing diagram (identity / subscription / model routing) on the right.</desc>

  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="20" fill="#0b0e14"/>

  <g stroke="#1c2230" stroke-width="1" opacity="0.55">
    <path d="M40 312 H1160"/>
  </g>

  <!-- LEFT: title block -->
  <g transform="translate(56 52)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="15" letter-spacing="2.5" fill="#3fb950" font-weight="600">CURSOR · BYOK · LOCAL PROXY</text>
    <text x="0" y="56" font-size="58" font-weight="700" fill="#e6edf3">cursor-switch</text>
    <text x="0" y="100" font-size="19" fill="#c9d1d9">Route any LLM API key into Cursor IDE</text>
    <text x="0" y="128" font-size="19" fill="#c9d1d9">Keep the real-account marketplace fully working</text>
    <text x="0" y="156" font-size="19" fill="#a371f7">+ precise per-model cost &amp; usage stats</text>
    <g transform="translate(0 196)" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7d8590">
      <text x="0" y="0">Wails v3 · Go + Vue 3</text>
      <text x="0" y="22">ed25519 signed updates · per-machine CA</text>
      <text x="0" y="44">OpenAI-compatible / Anthropic-compatible</text>
    </g>
  </g>

  <!-- RIGHT: three-plane routing diagram -->
  <g transform="translate(640 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="80" y="0" width="150" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="155" y="27" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Cursor client</text>

    <rect x="80" y="108" width="150" height="48" rx="10" fill="#0d2818" stroke="#3fb950" stroke-width="1.4"/>
    <text x="155" y="130" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="700">cursor-switch</text>
    <text x="155" y="148" font-size="11" fill="#7d8590" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">local routing + agent</text>

    <path d="M155 44 V104" stroke="#7d8590" stroke-width="1.6" fill="none" marker-end="url(#arrowMuted)"/>

    <rect x="288" y="56" width="178" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="377" y="74" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="600">identity / marketplace / login</text>
    <text x="377" y="89" font-size="11" fill="#7d8590" text-anchor="middle">passthrough · real account</text>

    <rect x="288" y="112" width="178" height="40" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="377" y="130" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="600">subscription / plan / usage</text>
    <text x="377" y="145" font-size="11" fill="#7d8590" text-anchor="middle">local mock · unlimited Pro</text>

    <rect x="288" y="168" width="178" height="40" rx="9" fill="#1a1530" stroke="#a371f7" stroke-width="1.4"/>
    <text x="377" y="186" font-size="13" fill="#a371f7" text-anchor="middle" font-weight="600">model inference / data plane</text>
    <text x="377" y="201" font-size="11" fill="#7d8590" text-anchor="middle">byok · your provider key</text>

    <path d="M230 124 C 252 124, 266 76, 288 76" stroke="#3fb950" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
    <path d="M230 132 H288" stroke="#7d8590" stroke-width="1.5" fill="none" marker-end="url(#arrowMuted)"/>
    <path d="M230 140 C 252 140, 266 188, 288 188" stroke="#a371f7" stroke-width="1.5" fill="none" marker-end="url(#arrowPurple)"/>

    <text x="478" y="80" font-size="11.5" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">→ cursor.sh</text>
    <text x="478" y="136" font-size="11.5" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">→ local</text>
    <text x="478" y="192" font-size="11.5" fill="#a371f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">→ your API</text>

    <text x="305" y="246" font-size="13" fill="#7d8590" text-anchor="middle">three control planes · isolated</text>
  </g>
</svg>
